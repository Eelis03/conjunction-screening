name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python 3.12 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # The floor is the coverage measured on the recording machine, 95.75 per
      # cent, rounded down and given two points of headroom. The figures the
      # README embeds are not compared here: matplotlib output is not byte
      # reproducible across platforms, so a byte comparison would fail on a font
      # rendering difference and say nothing about the mathematics.
      - name: Run tests
        run: >
          uv run pytest -q
          --cov=src/conjunction_screening
          --cov-report=term-missing
          --cov-fail-under=93

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy
